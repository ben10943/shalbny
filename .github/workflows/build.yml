name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v --tb=short

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone Shalbny.exe
        run: python build_exe.py

      - name: Build Shalbny_Setup.exe installer
        run: python build_setup_exe.py

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Shalbny ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Shalbny.exe
            dist/Shalbny_Setup.exe
